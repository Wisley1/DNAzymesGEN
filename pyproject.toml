[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = [
    "Data",
    "candidates",
    "checkpoints",
    "generated",
    "improved_wgan_training/tflib",
    "*.ipynb",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
]
ignore = [
    "E501",  # line length is left to the formatter
]

[tool.ruff.lint.isort]
known-first-party = ["tflib"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
